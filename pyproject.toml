[project]
name = "hausto-agente-fatura"
version = "0.1.0"
description = "Agente de decisão de pagamento de fatura (LangChain create_agent + FastAPI)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "langchain>=1.0",
  "langchain-google-genai>=3.0",
  "langgraph>=1.0",
  "google-cloud-bigquery>=3.25",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "duckdb>=1.1"]
evals = [
    "agentevals>=0.0.9",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
